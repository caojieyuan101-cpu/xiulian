:root{
  /* layout: iOS-style large titles, grouped inset cards, bottom tab bar; poems set vertically on photos.
     colour: one dark "dusk" theme taken from two sunset photos - warm silhouette black, sunset coral,
     evening gold and dusk mauve. Deliberately single-theme: it looks the same in light and dark mode. */
  --bg:#1b1719; --card:#262023; --fill:rgba(255,236,228,.08); --fill2:rgba(255,236,228,.15);
  --label:#f4e9e6; --label2:#a3929a; --label3:#6f6369; --sep:#3a3135;
  --l:#a986ad; --r:#e9ac3c; --s:#e65a3e; --accent:#f07a52; --gold:#ffd27a; --good:#e9ac3c; --danger:#ff6b55;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  --serif:"XiuSerif","Songti SC","STSong","Noto Serif SC",serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--label);font-family:var(--ui);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
main{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.view{display:none}
.view.on{display:block}
.lt{font-family:var(--serif);font-size:34px;font-weight:700;letter-spacing:.06em;margin:10px 4px 0;line-height:1.2}
.sub{color:var(--label2);font-size:15px;margin:2px 4px 18px}
.gt{font-size:13px;color:var(--label2);margin:24px 16px 7px;letter-spacing:.02em}
.gf{font-size:13px;color:var(--label2);margin:8px 16px 0;line-height:1.45}
.card{background:var(--card);border-radius:14px;overflow:hidden}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:50px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.row.ind+.row.ind::before{left:52px}
.row .grow{flex:1;min-width:0}
.row .val{color:var(--label2);font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{color:var(--label3);font-size:20px;line-height:1}
.tap:active{background:var(--fill)}
.ico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none;font-size:14px;font-weight:600}
.plus{width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--accent);font-size:20px;font-weight:500;flex:none}

/* today */
.rings{display:flex;align-items:center;gap:18px}
.rings svg{width:140px;height:140px;flex:none}
.legend{display:flex;flex-direction:column;gap:10px;min-width:0}
.legend div{display:flex;flex-direction:column}
.legend b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.legend small{font-size:13px;color:var(--label2)}
.legend span{font-size:13px;font-weight:600}
.trio{display:grid;grid-template-columns:repeat(3,1fr)}
.trio div{padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.trio div+div{border-left:.5px solid var(--sep)}
.trio b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.trio small{font-size:12px;color:var(--label2)}
.mini-poem{font-family:var(--serif);font-size:17px;line-height:1.7;padding:16px;-webkit-user-select:text;user-select:text}
.mini-poem small{display:block;font-family:var(--ui);font-size:13px;color:var(--label2);margin-top:6px}

/* focus */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;padding:6px 0;border-radius:7px;font-size:14px;font-weight:500}
.seg button.on{background:#40363a;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.face{display:grid;place-items:center;margin:26px 0 8px;position:relative}
.face svg{width:min(72vw,280px);height:min(72vw,280px)}
.face .t{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:4px}
.face .t b{font-size:min(17vw,68px);font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.face .t small{font-size:14px;color:var(--label2)}
.stepper{display:flex;align-items:center;background:var(--fill);border-radius:9px;overflow:hidden;flex:none}
.stepper button{width:44px;height:32px;font-size:20px;color:var(--label)}
.stepper button:active{background:var(--fill2)}
.stepper button+button{border-left:.5px solid var(--sep)}
.primary{display:block;width:100%;background:var(--accent);color:#fff;border-radius:14px;padding:15px;font-size:17px;font-weight:600;text-align:center}
.primary:active{opacity:.8}
.secondary{display:block;width:100%;background:var(--fill);color:var(--accent);border-radius:14px;padding:15px;font-size:17px;font-weight:600;text-align:center}

/* skill */
.realm{padding:18px 16px 16px;display:flex;flex-direction:column;gap:4px}
.realm .eyebrow{font-size:13px;color:var(--label2)}
.realm h2{margin:0;font-family:var(--serif);font-size:34px;font-weight:700;letter-spacing:.12em}
.realm p{margin:0;font-size:15px;color:var(--label2)}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.realm .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--label2);margin-top:6px}
.radar{display:grid;place-items:center;padding:8px 0 4px}
.radar svg{width:100%;max-width:340px;height:auto;overflow:visible}

/* log */
.chart svg{width:100%;height:auto;display:block}
.day-entries{padding:0 16px 10px 52px;display:flex;flex-direction:column;gap:2px}
.entry{display:flex;align-items:center;gap:10px;font-size:15px;padding:6px 0}
.entry .grow{flex:1;color:var(--label2)}
.entry button{color:var(--danger);font-size:14px;padding:4px 8px}
.segs{display:flex;height:6px;width:64px;border-radius:3px;overflow:hidden;background:var(--fill);flex:none}
.segs i{display:block;height:100%}
.pnav{display:flex;align-items:center;justify-content:space-between;margin:12px 0 10px}
.pnav b{font-size:17px;font-weight:600}

function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function loadLocal(){ const s=lsGet(LS); if(s&&s.v===1){ if(s.timer&&!TM){ TM=s.timer; saveT(); } return normalize(s); } return null; }

/* sync: the PWA keeps everything in this browser. The Claude page keeps the
   records in its own data.json and saves by publishing that file. */
let S = TARGET==='pwa' ? (loadLocal()||defState()) : defState();
let sync = TARGET==='pwa' ? 'local' : 'loading'; // loading | cloud | saving | local | readonly
let art=null, assets=null, dls=null, dataOk=false, loadedAt=Date.now(), pubT=null, pubBusy=false, pubAgain=false, pubRetried=false;
function save(){
  if(sync==='local'){ if(!lsSet(LS,S)) toast('保存失败：存储空间不足'); return; }
  if(sync==='readonly') return;
  lsSet(LP,{state:S,base:loadedAt}); // survives a reload until the publish lands
  clearTimeout(pubT); pubT=setTimeout(publishNow,2000);
  if(sync==='cloud') setSync('saving');
}
function setSync(v){ sync=v; if(tab==='log') renderLog(); }
async function publishNow(){
  clearTimeout(pubT); pubT=null;
  if(!art || !dataOk || (sync!=='cloud' && sync!=='saving')) return;
  if(pubBusy){ pubAgain=true; return; }
  pubBusy=true; const snap=JSON.stringify(S);
  try{
    await art.publish({'data.json':{content:snap,contentType:'application/json'}});
    pubRetried=false;
    if(JSON.stringify(S)===snap){ lsSet(LP,null); setSync('cloud'); }
  }catch(e){
    const c=e&&e.code;
    if(c==='conflict') toast('另一台设备刚保存过，页面马上刷新');
    else if(['not_writer','not_granted','consent_required','not_declared'].indexOf(c)>=0){ lsSet(LP,null); setSync('readonly'); toast('你只有查看权限，改动不会保存'); }
    else if(['capability_disabled','capability_removed'].indexOf(c)>=0){ lsSet(LP,null); lsSet(LS,S); setSync('local'); toast('这里不能同步，记录先存在这台设备上'); }
    else if(c==='rate_limited'){ pubT=setTimeout(publishNow,15000); }
    else if(!pubRetried){ pubRetried=true; pubT=setTimeout(publishNow,2000+Math.random()*3000); }
    else { pubRetried=false; toast('同步失败，下次记录时会再试'); }
  }
  pubBusy=false;
  if(pubAgain){ pubAgain=false; publishNow(); }
}
// edits saved here but not yet published when the page reloaded: keep them,
// and keep entries another device added after this one loaded
function mergePending(remote,p){
  const st=normalize(p.state), base=p.base||0;
  const ids=new Set(st.entries.map(e=>e.id)); remote.entries.forEach(e=>{ if(!ids.has(e.id) && e.t>base) st.entries.push(e); });
  const pids=new Set(st.photos.map(x=>x.id)); remote.photos.forEach(x=>{ if(!pids.has(x.id) && x.added>base) st.photos.push(x); });
  st.collected=Object.assign({},remote.collected,st.collected);
  return st;
}
async function bootCloud(){
  const use=n=> (window.claude && typeof window.claude.use==='function') ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
  use('assets').then(a=>{ assets=a; if(sheetKind==='photos') drawSheet(); });
  use('downloads').then(d=>{ dls=d; });
  let remote=null;
  try{ const r=await fetch('data.json',{cache:'no-store'}); if(r.ok){ const o=await r.json(); remote= o&&o.v===1 ? normalize(o) : defState(); dataOk=true; } }catch(e){}
  loadedAt=Date.now();
  const p=lsGet(LP);
  S = remote||defState();
  if(p&&p.state&&dataOk) S=mergePending(S,p);
  await loadPhotos(); if(WP.mode==='open' && !TM) stepWp(); render(); if(TM) openStage();
  art = await use('artifact');
  if(art && dataOk){ sync='cloud'; if(lsGet(LP)){ setSync('saving'); publishNow(); } }
  else { const l=loadLocal(); if(l) S=l; sync='local'; await loadPhotos(); }
  render();
}

function addD(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
const today = () => dkey(new Date());
function fmtMin(m){ m=Math.round(m); if(m<60) return m+' 分钟'; const h=Math.floor(m/60), r=m%60; return r? h+' 小时 '+r+' 分' : h+' 小时'; }
function fmtH(m){ return (m/60).toFixed(m>=600?0:1).replace(/\.0$/,''); }

/* ---------- numbers ---------- */
function minsOn(day,k){ let t=0; for(const e of S.entries) if(e.d===day && (!k||e.k===k)) t+=e.m; return t; }
function minsAll(k){ let t=0; for(const e of S.entries) if(!k||e.k===k) t+=e.m; return t; }
function valOf(k, mins){ const b=S.base[k]; return 100-(100-b)*Math.exp(-(mins/60)/TAU); }
function val(k){ return valOf(k, minsAll(k)); }
function minsToNext(k){
  const b=S.base[k], v=val(k), target=Math.floor(v+1e-9)+1;
  if(target>=100) return null;
  const h=-TAU*Math.log((100-target)/(100-b));
  return Math.max(1, Math.ceil(h*60 - minsAll(k)));
}
function avgVal(){ return (val('l')+val('r')+val('s'))/3; }
function realmOf(v){ let i=0; for(let j=0;j<REALMS.length;j++) if(v>=REALMS[j][0]) i=j; return i; }
function streak(){
  const days=new Set(S.entries.map(e=>e.d)); let n=0, d=new Date();
  if(!days.has(dkey(d))) d=addD(d,-1);
  while(days.has(dkey(d))){ n++; d=addD(d,-1); }
  return n;
}

/* ---------- poems ---------- */
function pickPoem(){
  let pool=[]; for(let i=0;i<POEMS.length;i++) if(S.seen.indexOf(i)<0) pool.push(i);
  if(!pool.length){ S.seen=[]; pool=POEMS.map((_,i)=>i); }
  const i=pool[Math.floor(Math.random()*pool.length)];
  S.seen.push(i); return i;
}
function anyPoem(){ return Math.floor(Math.random()*POEMS.length); }
function poemHTML(i){
  const p=POEMS[i]; const cols=p[0].split(/[，。？！；、：]/).filter(Boolean);
  return '<div class="poem">'+cols.map(c=>'<span class="pc">'+esc(c)+'</span>').join('')+'<span class="pa">'+esc(p[1])+'《'+esc(p[2])+'》</span></div>';
}

/* ---------- photos (IndexedDB, stays on this phone) ---------- */
let photos=[]; // {id,url}
function db(){ return new Promise((res,rej)=>{ const r=indexedDB.open('xiulian',1); r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function loadPhotos(){
  try{
    const d=await db();
    const all=await new Promise((res,rej)=>{ const q=d.transaction('photos').objectStore('photos').getAll(); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
    photos.forEach(p=>{ if(!p.cloud) URL.revokeObjectURL(p.url); });
    photos=all.sort((a,b)=>a.added-b.added).map(p=>({id:p.id,url:URL.createObjectURL(p.blob)}));
  }catch(e){ photos=[]; }
  photos=S.photos.map(p=>({id:p.id,url:'/_blob/'+p.id,cloud:true})).concat(photos);
}
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image(); img.src=url; await img.decode();
    const max=1600, s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',0.86));
  } finally { URL.revokeObjectURL(url); }
}
async function addPhotos(files){
  let ok=0;
  if(assets){
    for(const f of files){
      try{ const blob=await shrink(f); if(!blob) continue; const r=await assets.upload(blob); S.photos.push({id:r.id,added:Date.now()}); ok++; }catch(e){}
    }
    if(ok) save();
  } else try{
    const d=await db();
    for(const f of files){
      try{ const blob=await shrink(f); if(!blob) continue;
        await new Promise((res,rej)=>{ const t=d.transaction('photos','readwrite'); t.objectStore('photos').put({id:uid(),blob,added:Date.now()}); t.oncomplete=res; t.onerror=()=>rej(t.error); });
        ok++; }catch(e){}
    }
  }catch(e){}
  await loadPhotos();
  toast(ok? '已添加 '+ok+' 张照片' : '照片添加失败，换一张试试');
}
async function delPhoto(id){
  const i=S.photos.findIndex(p=>p.id===id);
  if(i>=0){
    if(!assets){ toast('这张照片只能在能编辑的设备上删除'); return; }
    try{ await assets.delete(id); }catch(e){ toast('删除失败，稍后再试'); return; }
    S.photos.splice(i,1); save(); await loadPhotos(); return;
  }
  try{ const d=await db(); await new Promise((res,rej)=>{ const t=d.transaction('photos','readwrite'); t.objectStore('photos').delete(id); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }catch(e){}
  await loadPhotos();
}
function photoUrl(id){ const p=photos.find(x=>x.id===id); return p?p.url:null; }

/* ---------- entries ---------- */
function addEntry(k,m,src,day,extra){
  const before=val(k);
  S.entries.push(Object.assign({id:uid(),d:day||today(),k,m,t:Date.now(),src},extra||{}));
  const after=val(k), pi=pickPoem();
  if(!S.collected[pi]) S.collected[pi]=today();
  S.last={pi,d:today()};
  save(); render();
  return {k,m,before,after,pi};
}

/* ---------- statistics: week / month / year / all ---------- */
let statP=(['week','month','year','all'].indexOf(lsGet('xiulian.statP'))>=0? lsGet('xiulian.statP') : 'month'), statOff=0;
const MILESTONES=[10,25,50,100,200,300,500,800,1000,1500,2000,3000];
function dayMap(){ const M=new Map(); for(const e of S.entries){ let o=M.get(e.d); if(!o){ o={l:0,r:0,s:0,t:0}; M.set(e.d,o); } o[e.k]+=e.m; o.t+=e.m; } return M; }
function goalMet(o){ return !!o && ORDER.every(k=>o[k]>=S.goals[k]); }
function daysBetween(a,b){ return Math.round((pkey(dkey(b))-pkey(dkey(a)))/864e5); }
function firstDay(){ let f=today(); for(const e of S.entries) if(e.d<f) f=e.d; return pkey(f); }
function periodRange(p,off){
  const now=pkey(today());
  if(p==='week'){ const st=addD(now,-((now.getDay()+6)%7)+7*off); return [st,addD(st,6)]; }
  if(p==='month'){ const st=new Date(now.getFullYear(),now.getMonth()+off,1); return [st,new Date(st.getFullYear(),st.getMonth()+1,0)]; }
  if(p==='year'){ const y=now.getFullYear()+off; return [new Date(y,0,1),new Date(y,11,31)]; }
  return [firstDay(),now];
}
function periodLabel(p,off,a,b){
  const md=d=>(d.getMonth()+1)+'月'+d.getDate()+'日';
  if(p==='week') return off===0? '本周' : off===-1? '上周' : md(a)+' – '+(a.getMonth()===b.getMonth()? b.getDate()+'日' : md(b));
  if(p==='month') return off===0? '本月' : (a.getFullYear()!==new Date().getFullYear()? a.getFullYear()+'年' : '')+(a.getMonth()+1)+'月';
  if(p==='year') return off===0? '今年' : a.getFullYear()+'年';
  return '全部 · 从 '+a.getFullYear()+'年'+md(a);
}
function sumRange(M,a,b){
  const r={l:0,r:0,s:0,t:0,days:0,goal:0,best:null,bestD:null};
  for(let d=new Date(a); d<=b; d=addD(d,1)){ const k=dkey(d), o=M.get(k); if(!o||!o.t) continue;
    ORDER.forEach(x=>r[x]+=o[x]); r.t+=o.t; r.days++; if(goalMet(o)) r.goal++; if(!r.best||o.t>r.best){ r.best=o.t; r.bestD=k; } }
  return r;
}
function streaks(M){
  const days=[...M.keys()].filter(k=>M.get(k).t>0).sort(); let best=0, run=0, prev=null;
  for(const k of days){ run= prev && daysBetween(pkey(prev),pkey(k))===1 ? run+1 : 1; if(run>best) best=run; prev=k; }
  return {best, cur:streak()};
}
// stacked bars; items: [{label, l, r, s, hi, go}] in minutes
function barsSVG(items,opt){

  s+='<text x="0" y="10" font-size="10" fill="var(--label2)">'+(hours? fmtH(max)+' 小时' : max+' 分')+'</text>';
  s+='<line x1="24" x2="'+W+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--sep)"/>';
  if(opt.goal){ const gy=y(opt.goal).toFixed(1); s+='<line x1="24" x2="'+W+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--label3)" stroke-dasharray="3 4"/><text x="'+W+'" y="'+(gy-4)+'" text-anchor="end" font-size="10" fill="var(--label2)">每日目标 '+opt.goal+'</text>'; }

    if(!acc) s+='<rect x="'+x.toFixed(1)+'" y="'+(y(0)-2)+'" width="'+bw.toFixed(1)+'" height="2" rx="1" fill="var(--fill2)"/>';

// one square per day for a whole year, darker = closer to the daily goal
function heatSVG(M,year){

  const W=340, cs=Math.min(12,(W-20)/cols), sz=cs-1.5, top=14, goal=S.goals.l+S.goals.r+S.goals.s, now=pkey(today());
  let s='<svg viewBox="0 0 '+W+' '+(top+7*cs+2)+'" role="img" aria-label="'+year+' 年每日练习日历">';
  ['一','三','五'].forEach((w,i)=>{ s+='<text x="0" y="'+(top+(i*2)*cs+sz-1)+'" font-size="8" fill="var(--label3)">'+w+'</text>'; });
  for(let m=0;m<12;m++){ const d=new Date(year,m,1), c=Math.floor((lead+daysBetween(a,d))/7); s+='<text x="'+(14+c*cs)+'" y="9" font-size="9" fill="var(--label2)">'+(m+1)+'</text>'; }

  }

    h+= ids.length? '<div class="plist">'+ids.map(i=>'<div>'+esc(POEMS[i][0])+'<small>'+esc(POEMS[i][1])+'《'+esc(POEMS[i][2])+'》 · '+S.collected[i].slice(5).replace('-','月')+'日</small></div>').join('')+'</div>' : '<div class="gf" style="text-align:center">每次打卡会抽到一句，收集在这里。</div>';
  }
  $('sheet').innerHTML=h;
}
let dlgCb=null;
function dialog(title,msg,buttons){ // buttons: [{t,cls,fn}]
  $('dialog').innerHTML='<div class="alert"><div class="msg"><h4>'+esc(title)+'</h4>'+(msg?'<p>'+esc(msg)+'</p>':'')+'</div>'+buttons.map((b,i)=>'<button class="'+(b.cls||'')+'" data-dlg="'+i+'">'+esc(b.t)+'</button>').join('')+'</div>';
  dlgCb=buttons; $('dialog').classList.add('on');
}
let toastT=null, undoFn=null;
function toast(msg,undo){
  undoFn=undo||null;
  $('toast').innerHTML=esc(msg)+(undo?'<button data-undo="1">撤销</button>':'');
  $('toast').classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>$('toast').classList.remove('on'), undo?4500:2200);
}

/* ---------- check-in card ---------- */
let cardAfterFocus=false;
function showCard(res, afterFocus){
  cardAfterFocus=!!afterFocus;
  const d=new Date();
  let h='<div class="qcard"><div class="photo" id="cardPhoto"></div><div class="shade"></div>'+(todayMet()? SEAL : '')+poemHTML(res.pi);
  h+='<div class="info"><span class="stamp">'+d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+' · '+(todayMet()? '今日达标' : res.round? '今天第 '+res.round+' 个番茄' : '打卡')+'</span><b>'+SK[res.k].name+' +'+res.m+' 分钟</b><span>'+SK[res.k].name+'修为 '+res.before.toFixed(2)+' → '+res.after.toFixed(2)+'</span></div></div>';
  h+='<div class="card-actions">'+(afterFocus?'<button class="alt" data-card="rest">'+(nextRest>S.pomo.rest?'长休息 ':'休息 ')+nextRest+' 分钟</button>':'')+'<button data-card="done">完成</button></div>';
  $('cardModal').innerHTML=h; paintWp($('cardPhoto'));
  $('cardModal').classList.add('on');
}
function reopenCard(){
  if(!S.last) return;
  const d=new Date();
  let h='<div class="qcard"><div class="photo" id="cardPhoto"></div><div class="shade"></div>'+(todayMet()? SEAL : '')+poemHTML(S.last.pi)+'<div class="info"><span class="stamp">'+d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+' · 今日诗签</span><b>今日 '+minsOn(today())+' 分钟</b></div></div><div class="card-actions"><button data-card="done">完成</button></div>';
  $('cardModal').innerHTML=h; paintWp($('cardPhoto')); cardAfterFocus=false;
  $('cardModal').classList.add('on');
}

/* ---------- pomodoro ---------- */
let tickT=null, wake=null, actx=null;
function ensureAudio(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function chime(){
  try{ if(!actx) return; const now=actx.currentTime;
    [[880,0],[1318.5,.18],[1760,.36]].forEach(([f,t])=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0,now+t); g.gain.linearRampToValueAtTime(.25,now+t+.02); g.gain.exponentialRampToValueAtTime(.001,now+t+1.4); o.connect(g).connect(actx.destination); o.start(now+t); o.stop(now+t+1.5); });
  }catch(e){}
}
async function lockOn(){ try{ if('wakeLock' in navigator) wake=await navigator.wakeLock.request('screen'); }catch(e){ wake=null; } }
function lockOff(){ try{ wake&&wake.release(); }catch(e){} wake=null; }
const FREE_CAP=3*3600000; // a stopwatch left running pauses itself here
let nextRest=5;
const isFree=T=>T.mode==='free' && T.phase==='focus';
function leftMs(T){ T=T||TM; return T.left!=null? T.left : T.end-Date.now(); } // countdown
function elapsedMs(T){ T=T||TM; return isFree(T)? (T.left!=null? T.left : Date.now()-T.start) : T.total-leftMs(T); }
function roundsToday(){ return focusToday().n; }
function clockText(sec){ const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), x=sec%60; return (h? h+':'+String(m).padStart(2,'0') : String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0'); }
function startPhase(phase,min){
  ensureAudio();
  const P=S.pomo, free= phase==='focus' && P.mode==='free';
  min=min||(phase==='focus'? P.focus : P.rest);
  const ms=free? 0 : min*60000, now=Date.now();
  TM={phase,mode:free?'free':'pomo',k:P.k,total:ms,end:now+ms,start:now,left:null,poem:anyPoem(),round:(phase==='focus'&&!free)? roundsToday()+1 : 0};
  saveT(); openStage();
}
function openStage(){
  const T=TM; if(!T) return;
  paintWp($('stagePhoto'));
  $('stagePoem').innerHTML=poemHTML(T.poem||0);
  $('stagePhase').textContent= T.phase==='rest'? (T.total>S.pomo.rest*60000? '长休息' : '休息一下') : isFree(T)? '正计时 · '+SK[T.k].name : '专注 · '+SK[T.k].name+(T.round? ' · 第 '+T.round+' 个番茄' : '');
  $('stageMore').hidden= T.phase!=='focus' || isFree(T);
  $('stageStop').textContent= T.phase==='rest'? '跳过' : '结束';
  $('stage').classList.add('on'); lockOn();
  clearInterval(tickT); tickT=setInterval(tick,250); tick();
}
function closeStage(){ clearInterval(tickT); tickT=null; $('stage').classList.remove('on','paused'); lockOff(); document.title='日语修行'; }
function pauseToggle(){
  const T=TM; if(!T) return;
  if(isFree(T)){ if(T.left==null) T.left=Date.now()-T.start; else { T.start=Date.now()-T.left; T.left=null; } }
  else { if(T.left==null) T.left=T.end-Date.now(); else { T.end=Date.now()+T.left; T.left=null; } }
  saveT(); tick();
}
function tick(){
  const T=TM; if(!T){ closeStage(); return; }
  let sec;
  if(isFree(T)){
    const el=elapsedMs(T);
    if(el>=FREE_CAP && T.left==null && !T.capAsked){ T.capAsked=true; pauseToggle(); chime(); stopEarly('已经计时 3 小时，还在学吗？'); return; }
    sec=Math.floor(el/1000);
    $('stageTrack').style.width=(el%3600000/36000).toFixed(2)+'%'; // one lap per hour
  } else {
    const left=leftMs(); if(left<=0){ finishPhase(); return; }
    sec=Math.ceil(left/1000);
    $('stageTrack').style.width=((1-left/T.total)*100).toFixed(2)+'%';
  }
  const txt=clockText(sec);
  $('stageClock').textContent=txt;
  $('stagePause').textContent= T.left!=null? '继续' : '暂停';
  $('stage').classList.toggle('paused', T.left!=null);
  document.title=txt+' · '+(T.phase==='rest'? '休息' : SK[T.k].name);
}
function finishPhase(){
  const T=TM; TM=null; saveT(); closeStage(); chime();
  if(T.phase==='focus'){
    // dated by when it ended, even if the app was closed past midnight
    const res=addEntry(T.k, Math.round(T.total/60000), 'pomo', dkey(new Date(T.end)), {t:T.end, full:1});
    const n=roundsToday(); nextRest= n>0 && n%4===0 ? S.pomo.long : S.pomo.rest; res.round=n;
    showCard(res,true);
  } else {
    dialog('休息结束','准备好了就开始下一个番茄。',[{t:'再专注 '+S.pomo.focus+' 分钟',cls:'b',fn:()=>{ S.pomo.mode='pomo'; save(); startPhase('focus'); }},{t:'先不了'}]);
  }
}
function stopEarly(title){
  const T=TM; if(!T) return;
  if(T.phase==='rest'){ TM=null; saveT(); closeStage(); return; }
  const free=isFree(T), wasRunning=T.left==null||!!title;
  if(T.left==null) pauseToggle();
  const done=Math.floor(elapsedMs(T)/60000), src=free?'free':'pomo';
  const resume=()=>{ if(wasRunning && TM===T && T.left!=null) pauseToggle(); };
  const end=()=>{ TM=null; saveT(); closeStage(); };
  const word=free?'计时':'专注';
  if(done<1){ dialog(title||'结束这次'+word+'？','还不到 1 分钟，不会记录时间。',[{t:'结束',cls:'d',fn:end},{t:'继续'+word,cls:'b',fn:resume}]); return; }
  dialog(title||'结束这次'+word+'？','已经'+word+'了 '+fmtMin(done)+'。',[
    {t:'记录 '+fmtMin(done),cls:'b',fn:()=>{ end(); const res=addEntry(T.k,Math.min(done,600),src); showCard(res,false); }},
    {t:'不记录',cls:'d',fn:end},
    {t:'继续'+word,fn:resume}
  ]);
}

/* ---------- export / import ---------- */
async function exportData(){
  const text=JSON.stringify({app:'xiulian',exported:new Date().toISOString(),state:S});
  const name='日语修行备份-'+today()+'.json';
  if(TARGET==='artifact'){
    if(!dls){ toast('这里不能导出文件'); return; }
    try{ await dls.save({filename:name,data:text}); toast('已导出'); }
    catch(e){ if(!(e && e.code==='declined')) toast('导出失败'); }
    return;
  }
  try{
    const file=new File([text],name,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('已导出'); }
  catch(e){ toast('导出失败'); }
}
async function importData(file){
  try{
    const o=JSON.parse(await file.text()); const st=o&&o.state;
    if(!st || st.v!==1 || !Array.isArray(st.entries)) throw 0;
    dialog('从备份恢复？','备份里有 '+st.entries.length+' 条记录，会替换现在的记录。',[
      {t:'恢复',cls:'b',fn:()=>{ S=normalize(Object.assign({},st,{photos:S.photos})); save(); closeSheet(); render(); toast('已恢复'); }},
      {t:'取消'}]);
  }catch(e){ toast('这不是有效的备份文件'); }
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(WP.mode==='tap' && e.target.closest('.skycard.tapwp')){ stepWp(); renderToday(); return; }
  const b=e.target.closest('button'); if(!b) return;
  const ds=b.dataset;
  if(ds.tab){ tab=ds.tab; document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b)); document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+tab)); render(); window.scrollTo(0,0); return; }
  if(ds.add){ addK=ds.add; addM=15; addDay=0; openSheet('add'); return; }
  if(ds.reopen){ reopenCard(); return; }
  if(ds.pk){ S.pomo.k=ds.pk; save(); renderFocus(); return; }
  if(ds.pmode){ S.pomo.mode=ds.pmode; save(); renderFocus(); return; }
  if(ds.step){ const [f,n]=ds.step.split(':'); const lim={focus:[5,120],rest:[1,30],long:[5,60]}[f]; S.pomo[f]=Math.max(lim[0],Math.min(lim[1],S.pomo[f]+Number(n))); save(); renderFocus(); return; }
  if(b.id==='startFocus'){ startPhase('focus'); return; }
  if(b.id==='stagePause'){ pauseToggle(); return; }
  if(b.id==='stageMore'){ const T=TM; if(!T||isFree(T)||T.phase!=='focus') return; T.total+=300000; if(T.left!=null) T.left+=300000; else T.end+=300000; saveT(); tick(); toast('多专注 5 分钟'); return; }
  if(b.id==='stageStop'){ stopEarly(); return; }
  if(ds.card){ $('cardModal').classList.remove('on'); if(ds.card==='rest') startPhase('rest',nextRest); return; }
  if(ds.day){ openDay= openDay===ds.day? null : ds.day; renderLog(); return; }
  if(ds.statp){ statP=ds.statp; statOff=0; openDay=null; lsSet('xiulian.statP',statP); renderLog(); return; }
  if(ds.statnav){ statOff=Math.min(0,statOff+Number(ds.statnav)); openDay=null; renderLog(); return; }
  if(ds.gomonth!=null){ statP='month'; statOff=Number(ds.gomonth); openDay=null; renderLog(); window.scrollTo(0,0); return; }
  if(ds.goyear!=null){ statP='year'; statOff=Number(ds.goyear); renderLog(); window.scrollTo(0,0); return; }
  if(ds.del){ const i=S.entries.findIndex(x=>x.id===ds.del); if(i<0) return; const [gone]=S.entries.splice(i,1); save(); render(); toast('已删除 '+gone.m+' 分钟',()=>{ S.entries.push(gone); save(); render(); }); return; }
  if(ds.undo){ if(undoFn) undoFn(); undoFn=null; $('toast').classList.remove('on'); return; }
  if(ds.open){ openSheet(ds.open); return; }
  if(ds.sheet==='close'){ closeSheet(); return; }
  if(ds.sheet==='ok'){
    if(sheetKind==='add'){ const day=dkey(addD(new Date(),-addDay)); const k=addK, m=addM; closeSheet(); const res=addEntry(k,m,'manual',day); showCard(res,false); }
    else { closeSheet(); render(); }
    return;
  }
  if(ds.addday){ addDay=Number(ds.addday); drawSheet(); return; }
  if(ds.addm){ addM=Number(ds.addm); drawSheet(); return; }
  if(ds.addstep){ addM=Math.max(1,Math.min(300,addM+Number(ds.addstep))); drawSheet(); return; }
  if(ds.sstep){ const [p,n]=ds.sstep.split(':'); const [g,k]=p.split('.');
    if(g==='goals') S.goals[k]=Math.max(5,Math.min(300,S.goals[k]+5*Number(n)));
    else S.base[k]=Math.max(0,Math.min(90,S.base[k]+Number(n)));
    save(); drawSheet(); render(); return; }
  if(ds.pick){ $('photoInput').click(); return; }
  if(ds.wpmode){ const shown=curWp(); WP.mode=ds.wpmode; if(shown) setWp(shown.id); else saveWp(); drawSheet(); render(); return; }
  if(ds.wpset){ setWp(ds.wpset); drawSheet(); render(); return; }
  if(ds.wphide!=null){ const id=ds.wphide; dialog('删除这张壁纸？','',[{t:'删除',cls:'d',fn:()=>{ const shown=curWp(); WP.hide.push(id); if(shown&&shown.id===id){ const L=wpList(); WP.cur=L.length? L[0].id : null; } saveWp(); drawSheet(); render(); }},{t:'取消',cls:'b'}]); return; }
  if(ds.delphoto){ const id=ds.delphoto; dialog('删除这张照片？','',[{t:'删除',cls:'d',fn:async()=>{ await delPhoto(id); drawSheet(); render(); }},{t:'取消',cls:'b'}]); return; }
  if(ds.export){ exportData(); return; }
  if(ds.import){ $('importInput').click(); return; }
  if(ds.dlg!=null){ const btn=dlgCb&&dlgCb[Number(ds.dlg)]; $('dialog').classList.remove('on'); if(btn&&btn.fn) btn.fn(); return; }
});
$('scrim').addEventListener('click',closeSheet);
$('photoInput').addEventListener('change',async e=>{ const fs=[...e.target.files]; e.target.value=''; if(!fs.length) return; toast('正在添加…'); await addPhotos(fs); if(sheetKind==='photos') drawSheet(); render(); });
$('importInput').addEventListener('change',e=>{ const f=e.target.files[0]; e.target.value=''; if(f) importData(f); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ hiddenAt=Date.now(); if(pubT) publishNow(); } if(document.visibilityState==='visible'){ if(WP.mode==='open' && hiddenAt && Date.now()-hiddenAt>60000 && !TM) stepWp(); if(TM){ if(!$('stage').classList.contains('on')) openStage(); else { tick(); lockOn(); } } render(); } });

/* ---------- start ---------- */
render();
if(TARGET==='artifact') bootCloud();
else {
  loadPhotos().then(()=>{ if(WP.mode==='open' && !TM) stepWp(); render(); if(TM) openStage(); });
  if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
}
})();
</script>
